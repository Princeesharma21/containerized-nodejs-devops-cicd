
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-node-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  nginx:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: devops-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
